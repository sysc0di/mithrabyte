services:
  db:
    image: postgres:16-alpine
    container_name: mithrabyte-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mithrabyte
      POSTGRES_PASSWORD: mithrabyte
      POSTGRES_DB: mithrabyte
    ports:
      - "5432:5432"
    volumes:
      - mithrabyte-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mithrabyte -d mithrabyte"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mithrabyte-pgdata: